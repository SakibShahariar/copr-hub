[package]
name = "copr-hub"
version = "0.1.0"
edition = "2021"
description = "A native GTK4/libadwaita application for discovering and managing Fedora COPR projects"
license = "MIT"
repository = "https://github.com/SakibShahariar/copr-hub"
readme = "README.md"
keywords = ["fedora", "copr", "gtk", "linux"]
categories = ["gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.10" }
adw = { package = "libadwaita", version = "0.8" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
