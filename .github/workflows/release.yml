name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create and publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package application
        run: |
          set -eu
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tags must start with v." >&2; exit 1 ;;
          esac

          APP_ID="io.github.SakibShahariar.CoprHub"
          STAGING="dist/copr-hub"
          ARCHIVE="copr-hub-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz"

          install -Dm755 target/release/copr-hub "$STAGING/bin/copr-hub"
          install -Dm644 "data/${APP_ID}.desktop" "$STAGING/share/applications/${APP_ID}.desktop"
          install -Dm644 "data/${APP_ID}.metainfo.xml" "$STAGING/share/metainfo/${APP_ID}.metainfo.xml"
          install -Dm644 "data/icons/hicolor/scalable/apps/${APP_ID}.svg" "$STAGING/share/icons/hicolor/scalable/apps/${APP_ID}.svg"
          install -Dm644 README.md "$STAGING/README.md"
          install -Dm644 LICENSE "$STAGING/LICENSE"

          tar -C dist -czf "dist/$ARCHIVE" copr-hub
          (cd dist && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/copr-hub-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/copr-hub-${RELEASE_TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            --generate-notes \
            --target "$GITHUB_SHA"
