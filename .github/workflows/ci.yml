name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:


permissions:
  contents: write

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install GTK development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev pkg-config appstream desktop-file-utils libxml2-utils shellcheck

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      - name: Commit Cargo.lock when missing or outdated
        run: |
          if [ -n "$(git status --porcelain -- Cargo.lock)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m 'build: commit reproducible Cargo.lock (Refs #2)'
            git push
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check installer scripts
        run: sh -n scripts/install-local.sh scripts/uninstall-local.sh

      - name: Lint shell scripts
        run: shellcheck scripts/install-local.sh scripts/uninstall-local.sh

      - name: Validate desktop integration metadata
        run: |
          desktop-file-validate data/io.github.SakibShahariar.CoprHub.desktop
          xmllint --noout data/io.github.SakibShahariar.CoprHub.metainfo.xml
          appstreamcli validate --no-net data/io.github.SakibShahariar.CoprHub.metainfo.xml

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Check compilation
        run: cargo check --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
